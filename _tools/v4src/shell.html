<!DOCTYPE html>
<html lang="en" data-film="not-tarot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOT TAROT — An Ink Study in Seven Plates</title>
<meta name="description" content="A 45-second ink film about symbols that refuse to mean one thing. Drag the drop, name a card, make your own meaning.">
<meta name="theme-color" content="#FAF2EC">
<style>/*__FONT_CSS__*/</style>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="fit">
  <div id="stage" aria-label="NOT TAROT — a 45 second ink film">

    <div id="paperA" class="paper"></div>
    <div id="paperB" class="paper"></div>
    <div id="paperTone"></div>

    <div id="art">
      <div id="scenes"></div>
      <div id="fx"></div>
    </div>

    <div id="plateShadow"></div>
    <div id="vignette"></div>

    <div id="grain"><i></i><i></i><i></i><i></i></div>

    <div id="chrome">
      <svg id="rules" viewBox="0 0 1920 1080" aria-hidden="true">
        <rect x="64" y="64" width="1792" height="952" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <rect x="72" y="72" width="1776" height="936" fill="none" stroke="currentColor" stroke-width="0.8" opacity=".32"/>
        <path id="ruleB" d="M64 940 H288" stroke="currentColor" stroke-width="1" opacity=".45"/>
      </svg>
      <div class="mk mk-tl"></div><div class="mk mk-tr"></div>
      <div class="mk mk-bl"></div><div class="mk mk-br"></div>
      <div class="hdr">
        <span id="hdL">NOT TAROT — AN INK STUDY IN SEVEN PLATES</span>
        <span id="hdC"></span>
        <span id="hdR">PLATE I / VII</span>
      </div>
      <div class="ftr">
        <span id="ftL">FIG. I — GUTTA</span>
        <span class="ftd">◆</span>
        <span id="ftR">MMXXVI</span>
      </div>
      <div id="cap"><span id="capN">I</span><span id="capT">A single ink, listening for a pulse.</span></div>
    </div>

    <div id="hud" aria-hidden="true">
      <div class="hud-bar" id="hudBar" role="slider" aria-label="Film position">
        <div class="hud-line"><div id="hudFill"></div><div id="hudDot"></div></div>
        <div id="hudTip" class="hud-tip">00:00 · I · THE HEART</div>
      </div>
      <div class="hud-row">
        <div class="hud-l">
          <button id="bPlay" class="hb hb-ico" title="Play / pause (Space)" aria-label="Play or pause"><span id="playIco">❚❚</span></button>
          <button id="bRestart" class="hb" title="Restart (Home)">REPLAY</button>
          <span id="hudAct">I — THE HEART</span>
        </div>
        <div class="hud-c"><span id="hudClock">00:00</span><span class="hud-slash">/</span><span>00:45</span></div>
        <div class="hud-r">
          <button id="bSound" class="hb" title="Sound (M)">SOUND ON</button>
          <button id="bFull" class="hb hb-ico" title="Fullscreen (F)" aria-label="Fullscreen">⤢</button>
          <button id="bHelp" class="hb hb-ico" title="Controls (?)" aria-label="Help">?</button>
        </div>
      </div>
    </div>

    <nav id="chapters" aria-label="Chapters"></nav>
    <div id="holdRing"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg><span>SLOW</span></div>

    <div id="poster" role="button" tabindex="0" aria-label="Begin the film"></div>
    <div id="drawer" aria-hidden="true"></div>
    <div id="help" aria-hidden="true"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="cursor" aria-hidden="true"><b></b><i></i></div>
  </div>
</div>
<div id="verticalFrame" aria-hidden="true">
  <div class="vf-top"><span>NOT TAROT</span><em>AN INK STUDY IN SEVEN PLATES</em></div>
  <div class="vf-bot"><span>MAKE YOUR OWN MEANING.</span><em>DRAG · TAP · BREATHE</em></div>
</div>
<script>window.A=/*__ASSETS__*/{};window.TX=/*__TEXTURES__*/{};</script>
<script>/*__JS__*/</script>
</body>
</html>
