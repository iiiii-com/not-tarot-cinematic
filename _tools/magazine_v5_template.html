<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>
/*__FONTS__*/
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0a0a;font-family:'Jost','Segoe UI',sans-serif;color:#14100F;-webkit-font-smoothing:antialiased}

#poster .p-mast{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:120px;line-height:.9;letter-spacing:.02em;color:#14100F}
#poster .p-rule{width:520px;height:1px;background:rgba(143,44,59,.85);margin:34px 0 30px;position:relative}
#poster .p-rule i{position:absolute;left:50%;top:-3px;width:7px;height:7px;background:#8F2C3B;transform:translateX(-50%) rotate(45deg)}
#poster .p-cn{font-family:'Songti SC','SimSun',serif;font-size:22px;line-height:2.05;color:#241F22;letter-spacing:.16em;text-align:center}
#poster .p-en{font-weight:400;font-size:11px;letter-spacing:.34em;color:#8F2C3B;margin-top:26px}
#poster .p-begin{margin-top:44px;border:1px solid rgba(20,16,15,.35);padding:13px 26px;font-size:10px;letter-spacing:.32em;color:#241F22;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
#hud{position:fixed;left:0;right:0;bottom:0;height:76px;display:flex;align-items:center;gap:20px;padding:0 40px;z-index:80;background:linear-gradient(to top,rgba(8,7,7,.94),rgba(8,7,7,0));font-size:11px;letter-spacing:.16em;color:#cbbfb8}

#bar{position:relative;flex:1;height:1px;background:rgba(255,255,255,.20);cursor:pointer}
#bar i{position:absolute;left:0;top:-1px;height:3px;width:0;background:#F6B7CC}
#bar b{position:absolute;top:-4px;left:0;width:9px;height:9px;border-radius:50%;background:#F6B7CC;transform:translateX(-50%)}
#hud button,#chapters button{background:none;border:0;color:#cbbfb8;font:inherit;letter-spacing:inherit;cursor:pointer;padding:0}
#hud button:hover,#chapters button:hover{color:#fff}
#chapters{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:80}
#chapters button{font-size:10px;letter-spacing:.1em;opacity:.5;transition:opacity .2s}
#chapters button.on{opacity:1;color:#F6B7CC}
.cap{font-weight:400;letter-spacing:.26em;text-transform:uppercase}
.kick{font-weight:500;letter-spacing:.36em;text-transform:uppercase}
</style>
</head>

<div id="wrap">

<script>
"use strict";
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture')==='1';
const VERT = Q.get('vert')==='1';
const W = VERT?1080:1920, H = VERT?1920:1080;
const COL = {page:'#FEFBF6',cream:'#FAF2EC',ink:'#14100F',berry:'#8F2C3B',blush:'#F7C7C7',rose:'#F6B7CC',gold:'#7B5521',goldd:'#5E3E17',bone:'#F7F2E6',plum:'#241F22'};
const A = /*__ASSETS__*/{};
const TAU = Math.PI*2;

const stage = document.getElementById('stage');
const sceneLayer = document.getElementById('scenes');
stage.style.width = W+'px'; stage.style.height = H+'px';
if(Q.get('t')) {}

function E(tag,parent,css){ const e=document.createElement(tag); if(css) Object.assign(e.style,css); (parent||stage).appendChild(e); return e; }
function TX(parent,s,css){ if(css&&css.position===undefined&&(css.left!==undefined||css.right!==undefined||css.top!==undefined||css.bottom!==undefined)) css=Object.assign({position:'absolute'},css); const e=E('div',parent,css); e.textContent=s; return e; }
function IMG(parent,src,css){ const e=E('img',parent,Object.assign({position:'absolute'},css)); e.src=src; e.draggable=false; return e; }
function B(parent,css){ return E('div',parent,Object.assign({position:'absolute'},css)); }
const cl = x=>x<0?0:x>1?1:x;
const R = (p,a,b)=>cl((p-a)/(b-a));
const eo = x=>1-Math.pow(1-x,3);
const eio = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb = x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function sero(sz,it){ return (it?'italic ':'')+'600 '+sz+'px/0.94 "Cormorant Garamond",Georgia,serif'; }
function sans(sz,w,ls){ return (w||400)+' '+sz+'px/1.5 "Jost","Segoe UI",sans-serif'; }
function kick(d,s,o){ const css={font:sans(11,500),letterSpacing:'0.36em',color:COL.berry,textTransform:'uppercase',opacity:'0'}; Object.assign(css,o||{}); const t=TX(d,s,css); return t; }
function layerFade(u,items){ u.push(p=>{ items.forEach((it,i)=>{ const q=eo(R(p, it.a==null?0.02+i*0.05:it.a, it.b==null?0.35+i*0.05:it.b)); it.el.style.opacity=String(q*(it.op==null?1:it.op)); }); }); }

/* ---------- sticker ---------- */
function sticker(parent,src,o){
  const size=o.size, ratio=o.ratio||1.0, h=size*ratio, rot=o.rot||0;
  const st=B(parent,{left:o.x,top:o.y,width:size+'px',height:h+'px',transform:'translate(-50%,-50%) rotate('+rot+'deg)',transformOrigin:'50% 62%',zIndex:o.z||2});
  st.style.background='#FEFBF6';
  st.style.borderRadius=Math.round(size*0.13)+'px';
  st.style.padding=Math.max(6,Math.round(size*0.032))+'px';
  st.style.boxShadow='0 '+Math.round(size*0.10)+'px '+Math.round(size*0.18)+'px rgba(36,31,34,.20), 0 2px 5px rgba(36,31,34,.10)';
  const face=B(st,{position:'relative',width:'100%',height:'100%',background:o.face||COL.blush,borderRadius:Math.round(size*0.10)+'px',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',boxShadow:'inset 0 0 0 1px rgba(20,16,15,.16)'});
  const ih=o.iconH||0.64;
  const im=IMG(face,src,{position:'relative',height:Math.round(h*ih)+'px',width:'auto',maxWidth:'74%'});
  const ob={el:st,face:face,im:im,size:size,rot:rot,base:'translate(-50%,-50%) rotate('+rot+'deg)'};
  if(o.label){
    const lb=B(st,{left:'50%',top:'100%',transform:'translate(-50%,-6px)',marginTop:Math.round(size*0.05)+'px',font:sans(Math.max(9,Math.round(size*0.048)),500),letterSpacing:'0.26em',color:COL.ink,whiteSpace:'nowrap',opacity:'0.92'});
    lb.textContent=o.label; ob.label=lb;
  }
  return ob;
}

/* ---------- barcode ---------- */
function barcode(parent,o){
  const wrap=B(parent,Object.assign({display:'flex',alignItems:'flex-end',gap:'3px',height:'34px'},o));
  for(let i=0;i<26;i++){ const w=(i%4===0)?3:(i%3===0?2:1); const h=34*(i%5===0?1:(0.55+((i*37)%40)/70)); B(wrap,{width:w+'px',height:h+'px',background:COL.ink}); }
  return wrap;
}
function ecgPath(parent,color){
  const ns='http://www.w3.org/2000/svg';
  const s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox','0 0 900 120'); s.setAttribute('preserveAspectRatio','none');
  Object.assign(s.style,{position:'absolute',overflow:'visible'});
  const p=document.createElementNS(ns,'path');
  p.setAttribute('d','M0 78 L150 78 L172 70 L192 84 L212 18 L238 112 L262 78 L330 78 L352 71 L372 83 L390 42 L410 96 L428 78 L900 78');
  p.setAttribute('fill','none'); p.setAttribute('stroke',color); p.setAttribute('stroke-width','2.4'); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  p.setAttribute('stroke-dasharray','1400'); p.setAttribute('stroke-dashoffset','1400');
  s.appendChild(p); parent.appendChild(s); return p;
}

/* ---------- 01 COVER ---------- */
function s01(d,u){
  B(d,{inset:'0',background:COL.page});
  const mx=VERT?'8.5%':'5.2%';
  const k=kick(d,'ISSUE 01 — THE ANSWER ISSUE — MMXXVI',{left:mx,top:VERT?'5.2%':'7.4%'});
  const mast=TX(d,'NOT TAROT',{left:mx,top:VERT?'9.6%':'12.6%',font:sero(VERT?102:182),letterSpacing:'0.02em',color:COL.ink,opacity:'0'});
  const rule=B(d,{left:mx,right:mx,top:VERT?'21.4%':'37.2%',height:'1px',background:COL.berry,opacity:'0',transform:'scaleX(0)',transformOrigin:'left'});
  const lines=[];
  ['78 CARDS.','ONE ANSWER.','THAT IS YOURS.'].forEach((s,i)=>{
    const t=TX(d,s,{left:mx,top:(VERT?24.6+i*4.3:42.5+i*7.4)+'%',font:sero(VERT?50:58,true),letterSpacing:'0.005em',color:COL.ink,opacity:'0'});
    lines.push(t);
  });
  const st=[
    sticker(d,A.ic_heart,{x:VERT?'33%':'72%',y:VERT?'53%':'37%',size:VERT?236:318,rot:5,face:COL.blush,label:'TEARS ARE POWER'}),
    sticker(d,A.ic_mirror,{x:VERT?'71%':'87%',y:VERT?'54%':'70%',size:VERT?196:238,rot:-8,face:COL.rose}),
    sticker(d,A.ic_crown,{x:VERT?'52%':'63%',y:VERT?'76%':'79%',size:VERT?168:190,rot:9,face:COL.blush})
  ];
  const foot=TX(d,'A FILM IN SEVEN PLATES · 45 SECONDS',{left:mx,top:VERT?'87.6%':'88.5%',font:sans(11,500),letterSpacing:'0.3em',color:COL.berry,opacity:'0'});
  const bar=barcode(d,{left:mx,top:VERT?'91.4%':'83.4%'});
  const price=TX(d,'ISSUE 01 · €0.00 · FREE',{right:mx,top:VERT?'91.6%':'83.9%',font:sans(10,400),letterSpacing:'0.18em',color:COL.ink,opacity:'0.75'});
  const folio=TX(d,VERT?'01':'01',{right:mx,top:VERT?'5.6%':'7.6%',font:sans(12,500),letterSpacing:'0.2em',color:COL.berry});
  u.push(p=>{
    const a=eo(R(p,0,.16)); k.style.opacity=String(a);
    const b=eo(R(p,.04,.34)); mast.style.opacity=String(b); mast.style.transform='translateY('+((1-b)*26)+'px)';
    const c=eo(R(p,.16,.5)); rule.style.opacity=String(c*.9); rule.style.transform='scaleX('+c+')';
    lines.forEach((t,i)=>{ const q=eo(R(p,.24+i*.07,.5+i*.07)); t.style.opacity=String(q); t.style.transform='translateY('+((1-q)*18)+'px)'; });
    st.forEach((s,i)=>{ const q=eb(R(p,.30+i*.08,.62+i*.08)); s.el.style.opacity=String(cl(R(p,.3+i*.08,.42+i*.08))); s.el.style.transform=s.base+' scale('+(0.84+0.16*q)+')'; if(s.label) s.label.style.opacity=String(cl(R(p,.4+i*.08,.6+i*.08))*.9); });
    foot.style.opacity=String(eo(R(p,.55,.78))); bar.style.opacity=String(eo(R(p,.58,.8))); price.style.opacity=String(eo(R(p,.6,.82))*.75);
    folio.style.opacity=String(eo(R(p,.02,.2)));
  });
}

/* ---------- 02 CONTENTS ---------- */
function s02(d,u){
  B(d,{inset:'0',background:COL.page});
  const mx=VERT?'8.5%':'5.2%';
  const k=kick(d,'02 — CONTENTS',{left:mx,top:VERT?'5.2%':'7.4%'});
  const title=TX(d,'In this issue',{left:mx,top:VERT?'10%':'13.5%',font:sero(VERT?78:126,true),color:COL.ink,opacity:'0'});
  const box=VERT?{left:mx,right:mx,top:'30%'}:{left:'50.5%',right:mx,top:'22%'};
  const rowsEl=B(d,Object.assign({display:'flex',flexDirection:'column',gap:VERT?'20px':'26px'},box));
  const items=[['03','THE HEART','03'],['07','THE INDEX','07'],['11','THE STICKER SHEET','11'],['15','THE SEAL','15'],['18','COLOPHON','18']];
  const rows=items.map((it,i)=>{
    const r=E('div',rowsEl,{display:'flex',alignItems:'baseline',gap:'16px',opacity:'0',paddingBottom:'10px',borderBottom:'1px dotted rgba(20,16,15,.30)'});
    const n=TX(r,it[0],{font:sans(12,500),letterSpacing:'0.2em',color:COL.berry,width:'40px'});
    const t=TX(r,it[1],{font:sero(VERT?30:38),color:COL.ink,whiteSpace:'nowrap'});
    
    const pn=TX(r,it[2],{font:sans(11,500),letterSpacing:'0.16em',color:COL.ink,opacity:'0.7',marginLeft:'auto'});
    return r;
  });
  const st=sticker(d,A.ic_heart,{x:VERT?'72%':'77%',y:VERT?'74%':'62%',size:VERT?150:232,rot:-7,face:COL.blush,label:'PEEL & KEEP'});
  const cap=TX(d,'SEVEN PLATES · ONE QUESTION · 78 SYMBOLS',{left:mx,top:VERT?'86%':'88%',font:sans(10,500),letterSpacing:'0.26em',color:COL.berry,opacity:'0'});
  const folio=TX(d,'02',{right:mx,top:VERT?'5.6%':'7.6%',font:sans(12,500),letterSpacing:'0.2em',color:COL.berry});
  u.push(p=>{
    k.style.opacity=String(eo(R(p,0,.2)));
    const t=eo(R(p,.05,.4)); title.style.opacity=String(t); title.style.transform='translateY('+((1-t)*22)+'px)';
    rows.forEach((r,i)=>{ const q=eo(R(p,.18+i*.07,.42+i*.07)); r.style.opacity=String(q); r.style.transform='translateY('+((1-q)*16)+'px)'; });
    const s=eb(R(p,.32,.6)); st.el.style.opacity=String(cl(R(p,.32,.44))); st.el.style.transform=st.base+' scale('+(0.86+0.14*s)+')';
    cap.style.opacity=String(eo(R(p,.55,.78))); folio.style.opacity=String(eo(R(p,.02,.18)));
  });
}

/* ---------- 03 FEATURE / THE HEART ---------- */
function s03(d,u){
  B(d,{inset:'0',background:COL.page});
  const mx=VERT?'8.5%':'5.2%';
  const k=kick(d,'03 — FEATURE / THE HEART',{left:mx,top:VERT?'5.2%':'7.4%'});
  const hl=[]; ['Everything','means','something.'].forEach((s,i)=>{
    hl.push(TX(d,s,{left:mx,top:(VERT?11+i*6.4:15.5+i*9.3)+'%',font:sero(VERT?66:104,true),color:COL.ink,opacity:'0'}));
  });
  const ecg=[];
  const ecgBox=B(d,{left:mx,top:VERT?'39%':'62%',width:VERT?'84%':'43%',height:'90px',opacity:'0'});
  ecg.push(ecgPath(ecgBox,COL.berry));
  const para=TX(d,'The card you draw is not a prediction. It is a mirror held at a useful angle: a symbol you can argue with, a face you can finally look at. Every meaning here is yours to keep — or to put back.',
    {left:mx,top:VERT?'70%':'74%',width:VERT?'84%':'43%',font:sans(VERT?15:16,400),lineHeight:'1.8',color:COL.ink,opacity:'0'});
  const st=sticker(d,A.ic_heart,{x:VERT?'50%':'77%',y:VERT?'33%':'43%',size:VERT?248:398,rot:-4,face:COL.blush});
  const cap=TX(d,'FIG. 01 — THE ANATOMICAL HEART, AFTER THE MINOR ARCANA',{left:VERT?'8.5%':'62%',top:VERT?'84%':'83%',font:sans(10,500),letterSpacing:'0.22em',color:COL.ink,opacity:'0.62',whiteSpace:'nowrap'});
  const folio=TX(d,'03',{right:mx,top:VERT?'5.6%':'7.6%',font:sans(12,500),letterSpacing:'0.2em',color:COL.berry});
  u.push(p=>{
    k.style.opacity=String(eo(R(p,0,.18)));
    hl.forEach((t,i)=>{ const q=eo(R(p,.06+i*.09,.4+i*.09)); t.style.opacity=String(q); t.style.transform='translateY('+((1-q)*26)+'px)'; });
    const e=eo(R(p,.3,.7)); ecgBox.style.opacity=String(e); ecg[0].setAttribute('stroke-dashoffset',String(1400*(1-e)));
    const q=eo(R(p,.42,.78)); para.style.opacity=String(q); para.style.transform='translateY('+((1-q)*16)+'px)';
    const s=eb(R(p,.16,.5)); st.el.style.opacity=String(cl(R(p,.16,.26))); st.el.style.transform=st.base+' scale('+(0.9+0.1*s)+')';
    cap.style.opacity=String(eo(R(p,.6,.8))*.62); folio.style.opacity=String(eo(R(p,.02,.18)));
  });
}

/* ---------- 04 THE INDEX ---------- */
function s04(d,u){
  B(d,{inset:'0',background:COL.page});
  const mx=VERT?'8.5%':'5.2%';
  const k=kick(d,'04 — THE INDEX',{left:mx,top:VERT?'5.2%':'7.4%'});
  const title=TX(d,'Seventy-eight symbols.',{left:mx,top:VERT?'9%':'11.5%',font:sero(VERT?50:76,true),color:COL.ink,opacity:'0'});
  const names=[A.ic_heart,A.ic_eye_tears,A.ic_butterfly,A.ic_tiger,A.ic_unicorn,A.ic_crown,A.ic_mirror,A.ic_compass,A.ic_hands,A.ic_wand,A.ic_skull,A.ic_moon,A.ic_cloud_eye,A.ic_book,A.ic_dragon,A.scissors_sym,A.flower_sym,A.ic_heart,A.ic_eye_tears,A.ic_crown];
  const labels=['HEART','TEARS','BECOME','FEARLESS','UNICORN','CROWN','MIRROR','COMPASS','HANDS','WAND','SKULL','MOON','CLOUD','BOOK','DRAGON','LET GO','CREATE','HEART II','TEARS II','CROWN II'];
  const cols=VERT?4:5, rowsv=VERT?5:4, total=cols*rowsv;
  const gx=VERT?.08:.052, gw=1-gx*2, gy=VERT?.22:.30, gh=VERT?.60:.56;
  const cells=[];
  for(let i=0;i<total;i++){
    const cx=gx+gw*((i%cols)+0.5)/cols, cy=gy+gh*(Math.floor(i/cols)+0.5)/rowsv;
    const cxPct=(cx*100).toFixed(2)+'%', cyPct=(cy*100).toFixed(2)+'%';
    const num=TX(d,String(i+1).padStart(3,'0'),{left:cxPct,top:cyPct,transform:'translate(-50%,-74px)',font:sans(10,500),letterSpacing:'0.18em',color:COL.berry,opacity:'0.8'});
    const im=IMG(d,names[i%names.length],{left:cxPct,top:cyPct,height:(VERT?84:104)+'px',width:'auto',transform:'translate(-50%,-50%)',opacity:'0'});
    const nm=TX(d,labels[i%labels.length],{left:cxPct,top:cyPct,transform:'translate(-50%,44px)',font:sans(VERT?7:9,500),letterSpacing:'0.2em',color:COL.ink,opacity:'0'});
    const cell={num,im,nm};
    // hairline column guides
    if(VERT){
      const v=B(d,{left:cxPct,top:(gy*100)+'%',height:(gh*100)+'%',width:'1px',background:'rgba(20,16,15,.10)',opacity:'0'});
      cell.guide=v;
    }
    cells.push(cell);
  }
  // vertical rules for horizontal grid
  if(!VERT){ for(let c=1;c<cols;c++){ const x=(gx+gw*c/cols)*100; B(d,{left:x.toFixed(2)+'%',top:(gy*100)+'%',height:(gh*100)+'%',width:'1px',background:'rgba(20,16,15,.10)'}); } }
  const folio=TX(d,'04',{right:mx,top:VERT?'5.6%':'7.6%',font:sans(12,500),letterSpacing:'0.2em',color:COL.berry});
  const cap=TX(d,'A–Z OF THE ORACLE · ICONS 01–20 OF 78',{left:mx,top:VERT?'86.5%':'89%',font:sans(10,500),letterSpacing:'0.24em',color:COL.berry,opacity:'0'});
  u.push(p=>{
    k.style.opacity=String(eo(R(p,0,.18)));
    const t=eo(R(p,.04,.34)); title.style.opacity=String(t); title.style.transform='translateY('+((1-t)*20)+'px)';
    cells.forEach((c,i)=>{ const q=eo(R(p,.12+(i%cols)*.02+Math.floor(i/cols)*.05,.3+(i%cols)*.02+Math.floor(i/cols)*.05)); c.im.style.opacity=String(q); c.num.style.opacity=String(q*.8); c.nm.style.opacity=String(q*.65); if(c.guide) c.guide.style.opacity=String(q*.7); });

function s05(d,u){
  B(d,{inset:'0',background:COL.page});
  const mx=VERT?'8.5%':'5.2%';

function render(t){
  for(let i=0;i<SCENES.length;i++){
    const a=TIMES[i][0], b=TIMES[i][1];
    let al;
    if(i===0) al=R(t,a-0.001,a+0.12); else al=R(t,a-0.12,a+0.12);
    al*= (i===SCENES.length-1) ? 1 : (1-R(t,b-0.12,b+0.12));
    SCENES[i].style.opacity=String(cl(al));
    const p=cl((t-a)/(b-a));
    const u=UPS[i]; for(let k=0;k<u.length;k++) u[k](p,t);
  }
}

  drone=g;
}
function soundOn(){ audioInit(); if(AC.state==='suspended') AC.resume(); drone.gain.cancelScheduledValues(AC.currentTime); drone.gain.linearRampToValueAtTime(0.05,AC.currentTime+1.4); SOUNDON=true; bSound.textContent='SOUND ON'; }
function soundOff(){ if(!AC) return; drone.gain.cancelScheduledValues(AC.currentTime); drone.gain.linearRampToValueAtTime(0.0,AC.currentTime+0.4); SOUNDON=false; bSound.textContent='SOUND OFF'; }
function fmt(t){ const s=Math.floor(t), m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function updateHUD(t){
  const q=cl(t/DUR); fill.style.width=(q*100)+'%'; knob.style.left=(q*100)+'%'; tc.textContent=fmt(t);
  const ci=TIMES.findIndex((x,i)=> t>=x[0] && t<x[1]); [...chaptersEl.children].forEach((b,i)=>b.classList.toggle('on',i===Math.max(0,ci)));
}
function seek(t){
  CURT=cl(t); if(PLAYING) T0=performance.now()/1000-CURT;
  render(CURT); updateHUD(CURT);
}
function play(){
  if(CAPTURE) return;
  posterEl.style.display='none';
  if(!SOUNDON && !AC) soundOn();
  PLAYING=true; T0=performance.now()/1000-CURT; bPlay.textContent='PAUSE';
  if(AC && AC.state==='suspended') AC.resume();
}
function pause(){ PLAYING=false; bPlay.textContent='PLAY'; }
posterEl.addEventListener('click',play);
bPlay.addEventListener('click',()=>{ if(CAPTURE) return; if(PLAYING) pause(); else play(); });
bRestart.addEventListener('click',()=>{ if(CAPTURE) return; seek(0); if(!PLAYING) play(); });
bSound.addEventListener('click',()=>{ if(SOUNDON) soundOff(); else soundOn(); });
bar.addEventListener('click',e=>{ const r=bar.getBoundingClientRect(); seek(((e.clientX-r.left)/r.width)*DUR); });
document.addEventListener('keydown',e=>{
  if(CAPTURE) return;
  if(e.code==='Space'){ e.preventDefault(); if(PLAYING) pause(); else play(); }
  if(e.code==='ArrowRight') seek(CURT+1);
  if(e.code==='ArrowLeft') seek(Math.max(0,CURT-1));
});

TIMES.forEach((x,i)=>{
  const b=E('button',chaptersEl,{}); b.textContent=String(i+1).padStart(2,'0');
  b.addEventListener('click',()=>seek(x[0]));
});

function fit(){
  if(CAPTURE){ stage.style.transform='none'; return; }
  const s=Math.min((innerWidth-56)/W,(innerHeight-116)/H);
  stage.style.transform='scale('+s+')';
}
addEventListener('resize',fit);

function tick(){
  if(PLAYING){
    const t=performance.now()/1000-T0;
    if(t>=DUR){ PLAYING=false; seek(DUR); bPlay.textContent='REPLAY'; }
    else { render(t); updateHUD(t); }
  }
  requestAnimationFrame(tick);
}

if(CAPTURE){
  hudEl.style.display='none'; chaptersEl.style.display='none'; posterEl.style.display='none';
  document.body.style.background='#FAF2EC';
  window.__renderAt=function(t){ render(t); };
  fit(); render(0);
  window.__rendered=true;
} else {
  fit();
  if(Q.get('t')){ posterEl.style.display='none'; seek(parseFloat(Q.get('t'))||0); }
  else { render(0); updateHUD(0); }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
